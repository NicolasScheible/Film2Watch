name: film2watch
description: "Film2Watch - gemeinsam in Minuten entscheiden, welchen Film ihr schaut"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  cloud_firestore: ^6.8.0
  crypto: ^3.0.7
  firebase_auth: ^6.5.7
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  firebase_storage: ^13.4.6
  flutter:
    sdk: flutter
  flutter_local_notifications: ^19.5.0
  flutter_riverpod: ^3.4.2
  google_sign_in: ^7.2.0
  http: ^1.6.0
  image_picker: ^1.2.3
  share_plus: ^13.3.0
  sign_in_with_apple: ^8.1.0
  youtube_player_flutter: ^10.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  firebase_auth_mocks: ^0.15.2
  fake_cloud_firestore: ^4.2.0
  firebase_storage_mocks: ^0.8.1
  webview_flutter_platform_interface: ^2.15.1

flutter:
  uses-material-design: true
